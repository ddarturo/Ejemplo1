name: CI/CD - HTML quality and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: HTML lint
        run: npm run lint:html

      - name: HTML validation
        run: npm run validate:html

      - name: Responsive checks
        run: npm run check:responsive

      - name: External links security check
        run: npm run check:links

      - name: Start local web server
        run: npm run serve -- --silent &

      - name: Install compatible Chrome + ChromeDriver
        run: |
          npx --yes browser-driver-manager install chrome@152
          CHROME_PATH=$(npx --yes browser-driver-manager which 2>/dev/null | awk -F': ' '/Browser:/ {print $2}')
          CHROMEDRIVER_PATH=$(npx --yes browser-driver-manager which 2>/dev/null | awk -F': ' '/Driver:/ {print $2}')
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> "$GITHUB_ENV"

      - name: Accessibility check (WCAG 2A)
        run: npx @axe-core/cli http://127.0.0.1:8080 --exit --tags wcag2a --chrome-path "$CHROME_PATH" --chromedriver-path "$CHROMEDRIVER_PATH"

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
